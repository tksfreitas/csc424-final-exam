name: Deploy to QA

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push frontend image
        run: |
          docker build -t ghcr.io/tksfreitas/csc424-frontend:latest ./frontend
          docker push ghcr.io/tksfreitas/csc424-frontend:latest

      - name: Build and push backend image
        run: |
          docker build -t ghcr.io/tksfreitas/csc424-backend:latest ./backend
          docker push ghcr.io/tksfreitas/csc424-backend:latest

      - name: Deploy to QA server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.QA_HOST }}
          username: ${{ secrets.QA_USER }}
          key: ${{ secrets.QA_SSH_KEY }}
          script: |
            cd ~/csc424-final-exam
            docker compose pull
            docker compose up -d
